name = "zenos-publications-jobs"
main = "src/index.py"
compatibility_date = "2026-04-07"
workers_dev = true
compatibility_flags = ["python_workers"]

[[d1_databases]]
binding = "DB"
database_name = "prd-zenos-blog-db"
database_id = "fa9659e2-584d-478f-97b9-2bcfdae5f309"

[triggers]
crons = [
  "30 18 * * SUN",
  "30 18 1 * *"
]

[vars]
ENVIRONMENT = "production"
API_BASE_URL = "https://api.zenos.work"
NEWSLETTER_WEEKLY_CRON = "30 18 * * SUN"
MAGAZINE_MONTHLY_CRON = "30 18 1 * *"
PUBLICATION_REQUIRE_APPROVAL = "false"
MAGAZINE_TARGET_PAGES = "80"
MAGAZINE_MIN_PAGES = "80"
MAGAZINE_MAX_PAGES = "120"
NEWSLETTER_TOP_ARTICLE_LIMIT = "12"
MAGAZINE_TOP_ARTICLE_LIMIT = "60"
NEWSLETTER_FROM = "Zenos Weekly <newsletter@zenos.work>"
MAGAZINE_FROM = "Zenos Magazine <magazine@zenos.work>"
RESEND_FROM = "editorial@zenos.work"

[env.staging]
[[env.staging.d1_databases]]
binding = "DB"
database_name = "staging-zenos-blog-db"
database_id = "4aa50a0e-58a7-4898-874d-63859e6b5f11"

[env.staging.vars]
ENVIRONMENT = "staging"
API_BASE_URL = "https://staging-api.zenos.work"
NEWSLETTER_WEEKLY_CRON = "30 18 * * SUN"
MAGAZINE_MONTHLY_CRON = "30 18 1 * *"
PUBLICATION_REQUIRE_APPROVAL = "false"
MAGAZINE_TARGET_PAGES = "80"
MAGAZINE_MIN_PAGES = "80"
MAGAZINE_MAX_PAGES = "120"
NEWSLETTER_TOP_ARTICLE_LIMIT = "12"
MAGAZINE_TOP_ARTICLE_LIMIT = "60"
NEWSLETTER_FROM = "Zenos Weekly <newsletter@zenos.work>"
MAGAZINE_FROM = "Zenos Magazine <magazine@zenos.work>"
RESEND_FROM = "editorial@zenos.work"